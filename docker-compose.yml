services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - INVENTORY_ADMIN_USER=${INVENTORY_ADMIN_USER:-admin}
      - INVENTORY_ADMIN_PASSWORD=${INVENTORY_ADMIN_PASSWORD:-admin123}
      - INVENTORY_ADMIN_TOKEN=${INVENTORY_ADMIN_TOKEN:-inventory-admin-token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/projects')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - inventory-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: inventory-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Para usar certificados reais, monte a pasta abaixo:
    # volumes:
    #   - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge
